name : continuous-integration

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: python3 -m unittest test_my_utils.py
    
  run_functional_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash test_print_fires.sh
  
  run_style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pycodestyle==2.14.0
      - run: pycodestyle $(git ls-files "*.py")